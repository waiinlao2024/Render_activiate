name: Render Keepalive

# 每 5 分钟 ping 一次 Render，防止免费实例休眠
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 支持手动触发，便于测试

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render 保活
        run: curl -s -o /dev/null -w "HTTP %{http_code} - $(date '+%Y-%m-%d %H:%M:%S')\n" --max-time 60 https://v42-booking.onrender.com/schedule_v4_3.html
